<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Hintergrund: weisse abgerundete Kachel mit feiner Kontur (gleiche Bildsprache wie die QR-App) -->
  <rect x="2" y="2" width="508" height="508" rx="92" fill="#FFFFFF" stroke="#E4E4E4" stroke-width="4"/>

  <!-- Rechnungsblatt -->
  <rect x="112" y="70" width="240" height="312" rx="20" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="14"/>

  <!-- Kopfzeile: Rechnungsnummer -->
  <rect x="150" y="122" width="120" height="18" rx="9" fill="#1A1A1A"/>

  <!-- Positionszeilen -->
  <rect x="150" y="178" width="164" height="13" rx="6.5" fill="#C4C7CF"/>
  <rect x="150" y="214" width="164" height="13" rx="6.5" fill="#C4C7CF"/>
  <rect x="150" y="250" width="104" height="13" rx="6.5" fill="#C4C7CF"/>

  <!-- Betragszeile, farbig hervorgehoben -->
  <rect x="150" y="302" width="94" height="20" rx="10" fill="#0073EA"/>

  <!-- XML-Badge: macht aus dem Blatt eine strukturierte E-Rechnung -->
  <circle cx="374" cy="358" r="96" fill="#0073EA" stroke="#FFFFFF" stroke-width="18"/>
  <path d="M346 326 L312 358 L346 390" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M402 326 L436 358 L402 390" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M386 316 L362 400" fill="none" stroke="#FFFFFF" stroke-width="17" stroke-linecap="round"/>
</svg>
